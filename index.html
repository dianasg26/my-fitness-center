<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Fitness Center</title>
<meta name="theme-color" content="#0A0610">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MFC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gNow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6A5A7C"/><stop offset="1" stop-color="#3B2E4A"/></linearGradient>
    <linearGradient id="gGoal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF4FA3"/><stop offset=".6" stop-color="#C45CFF"/><stop offset="1" stop-color="#6E3CD6"/></linearGradient>
  </defs>
</svg>

<div id="app">
  <header id="bar">
    <div class="bar-l"><span class="prompt">mfc</span><span class="path" id="path">~/hoy</span><span class="cursor">_</span></div>
    <div class="bar-r">
      <button class="chipbtn" data-act="palette" aria-label="Buscar o ejecutar comando">&gt;_ buscar</button>
      <button class="sync" id="sync" data-act="goto" data-to="yo" aria-label="Estado de sincronización"><i></i><span id="syncTxt">...</span></button>
    </div>
  </header>

  <main id="views">
    <section data-view="hoy"></section>
    <section data-view="log"></section>
    <section data-view="gym"></section>
    <section data-view="ciclo"></section>
    <section data-view="yo"></section>
  </main>

  <div class="dock" id="dock"></div>

  <nav id="tabs">
    <button data-act="goto" data-to="hoy"><svg viewBox="0 0 24 24"><path d="M4 11.5L12 4l8 7.5M6 10v9h5v-5h2v5h5v-9"/></svg>hoy</button>
    <button data-act="goto" data-to="log"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg>log</button>
    <button data-act="goto" data-to="gym"><svg viewBox="0 0 24 24"><path d="M3 12h2M19 12h2M5 8v8M19 8v8M7 12h10M7 9v6M17 9v6"/></svg>gym</button>
    <button data-act="goto" data-to="ciclo"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 8.6 6.3M12 3v6l4-2"/></svg>ciclo</button>
    <button data-act="goto" data-to="yo"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>yo</button>
  </nav>
</div>

<div id="overlay"></div>
<div id="toast"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
